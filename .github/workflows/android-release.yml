name: BASIRA Release AAB

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Firebase Android configuration
        run: |
          test -s android/app/google-services.json
          node scripts/verify-firebase-config.mjs

      - name: Install, test and sync
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run check
          npx cap sync android
          npm run verify:android

      - name: Prepare optional release signing
        id: signing
        env:
          BASIRA_RELEASE_KEYSTORE_BASE64: ${{ secrets.BASIRA_RELEASE_KEYSTORE_BASE64 }}
          BASIRA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.BASIRA_RELEASE_KEYSTORE_PASSWORD }}
          BASIRA_RELEASE_KEY_ALIAS: ${{ secrets.BASIRA_RELEASE_KEY_ALIAS }}
          BASIRA_RELEASE_KEY_PASSWORD: ${{ secrets.BASIRA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$BASIRA_RELEASE_KEYSTORE_BASE64" ] && [ -n "$BASIRA_RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$BASIRA_RELEASE_KEY_ALIAS" ] && [ -n "$BASIRA_RELEASE_KEY_PASSWORD" ]; then
            KEYSTORE="$RUNNER_TEMP/basira-release.keystore"
            printf '%s' "$BASIRA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            "$JAVA_HOME/bin/keytool" -list -keystore "$KEYSTORE" -storepass "$BASIRA_RELEASE_KEYSTORE_PASSWORD" -alias "$BASIRA_RELEASE_KEY_ALIAS" >/dev/null
            echo "BASIRA_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
            echo "BASIRA_KEYSTORE_PASSWORD=$BASIRA_RELEASE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BASIRA_KEY_ALIAS=$BASIRA_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "BASIRA_KEY_PASSWORD=$BASIRA_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets found. The AAB will be signed."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets are incomplete; building an UNSIGNED release candidate for validation only."
          fi

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon --console=plain

      - name: Verify release bundle
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          ls -lh "$AAB"
          sha256sum "$AAB"
          unzip -l "$AAB" | grep -q 'base/manifest/AndroidManifest.xml'
          unzip -l "$AAB" | grep -q 'base/dex/classes.dex'
          VERIFY_OUT="$RUNNER_TEMP/jarsigner.txt"
          "$JAVA_HOME/bin/jarsigner" -verify -verbose -certs "$AAB" > "$VERIFY_OUT" 2>&1 || true
          if [ "$SIGNED" = "true" ]; then
            grep -q 'jar verified' "$VERIFY_OUT"
            echo "SIGNED_RELEASE_AAB=true"
          else
            if grep -q 'jar verified' "$VERIFY_OUT"; then
              echo "::error::Bundle unexpectedly appears signed while signing secrets were absent."
              cat "$VERIFY_OUT"
              exit 1
            fi
            echo "SIGNED_RELEASE_AAB=false"
            echo "::notice::Release bundle structure is valid, but it is not publishable until release signing secrets are configured."
          fi

      - name: Upload signed release AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: basira-release-aab-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release candidate
        if: steps.signing.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: basira-release-aab-unsigned-candidate
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
