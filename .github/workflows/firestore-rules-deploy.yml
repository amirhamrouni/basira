name: Deploy BASIRA Firestore Rules

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type DEPLOY to publish BASIRA Firestore rules to production'
        required: true
        type: string
  push:
    branches:
      - ops/firestore-deploy-once

permissions:
  contents: read

jobs:
  deploy-rules:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm_production == 'DEPLOY') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-firestore-rules]')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate BASIRA Firebase target
        run: node scripts/verify-firebase-config.mjs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore rules only
        run: firebase deploy --only firestore:rules --project gen-lang-client-0217548336 --non-interactive
