name: BASIRA Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [feat/basira-context-engine]
  pull_request:
    branches: [main]

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.BASIRA_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          test -s android/app/google-services.json
          node -e "const c=require('./android/app/google-services.json').client; if(!c.some(x=>x.client_info?.android_client_info?.package_name==='com.basira.spiritportal'))process.exit(1)"
      - name: Install and verify
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run check
          npx cap sync android
          npm run verify:android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: basira-debug-apk-unverified
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 2
      - name: Sign with the existing BASIRA Android key
        env:
          BASIRA_DEBUG_KEYSTORE_BASE64: ${{ secrets.BASIRA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$BASIRA_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::notice::BASIRA_DEBUG_KEYSTORE_BASE64 is not configured; keeping the unsigned debug APK artifact."
            exit 0
          fi
          printf '%s' "$BASIRA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/basira-debug.keystore"
          "$JAVA_HOME/bin/keytool" -list -keystore "$RUNNER_TEMP/basira-debug.keystore" -storepass android -alias androiddebugkey -v | grep -q 'SHA1: D3:1F:0E:80:0F:45:20:5E:5B:BB:EE:DC:0A:70:12:A4:C6:A8:E6:E3'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/basira-debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/app-signed.apk" android/app/build/outputs/apk/debug/app-debug.apk
          mv "$RUNNER_TEMP/app-signed.apk" android/app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK and signing certificate
        env:
          BASIRA_DEBUG_KEYSTORE_BASE64: ${{ secrets.BASIRA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          if [ -n "$BASIRA_DEBUG_KEYSTORE_BASE64" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | grep -q 'SHA-1 digest: d31f0e80f45205e5bbbeedc0a7012a4c6a8e6e3'
          else
            echo "::notice::Signing key secret is missing; certificate continuity check skipped."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: basira-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
