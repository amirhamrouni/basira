name: Basira Quality Gate

on:
  pull_request:
  push:
    branches: [main, feat/basira-context-engine]

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run verify:android:structure
