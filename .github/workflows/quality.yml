name: Basira Quality Gate

on:
  pull_request:
  push:
    branches: [main, feat/basira-context-engine]

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify-firebase-config.mjs
      - run: npm install -g npm@11.6.0
      - run: npm install --no-audit --no-fund --legacy-peer-deps
      - run: npm run check
      - run: npm run verify:android:structure
  production-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/production-smoke.mjs
